```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #302c29;
      color: #f5f1eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      min-height: 100dvh;

      overflow: hidden;
    }

    .page {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    /* ---------- ЭКРАН ПАРОЛЯ ---------- */

    .password-screen {
      width: 100%;
      text-align: center;

      animation: appear 1s ease;
    }

    .heart {
      font-size: 24px;
      margin-bottom: 30px;
      font-weight: 300;
    }

    .password-screen h1 {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin: 0 0 28px;
    }

    .password-input {
      width: 100%;
      max-width: 280px;

      background: transparent;
      border: none;
      border-bottom: 1px solid #77716c;

      padding: 12px 8px;

      text-align: center;
      font-size: 18px;
      color: #f5f1eb;

      outline: none;
    }

    .password-input::placeholder {
      color: #96908a;
    }

    .password-input:focus {
      border-bottom-color: #f5f1eb;
    }

    .hint {
      margin-top: 22px;

      font-size: 13px;
      line-height: 1.6;

      color: #aaa39c;
    }

    .open-button {
      margin-top: 30px;

      background: none;
      border: 1px solid #77716c;
      border-radius: 30px;

      padding: 11px 28px;

      font-size: 14px;
      color: #f5f1eb;

      cursor: pointer;

      transition: all 0.25s ease;
    }

    .open-button:hover {
      background: #f5f1eb;
      color: #302c29;
    }

    .error {
      height: 20px;
      margin-top: 15px;

      font-size: 12px;
      color: #c99b9b;

      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .error.show {
      opacity: 1;
    }


    /* ---------- ЭКРАН ПЕСНИ ---------- */

    .song-screen {
      display: none;

      width: 100%;
      text-align: center;

      animation: songAppear 1.2s ease;
    }

    .cover {
      width: min(78vw, 320px);
      height: min(78vw, 320px);

      object-fit: cover;

      display: block;
      margin: 0 auto 38px;

      border-radius: 2px;

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35);
    }

    .play-button {
      width: 62px;
      height: 62px;

      border-radius: 50%;
      border: 1px solid #f5f1eb;

      background: transparent;
      color: #f5f1eb;

      font-size: 20px;

      display: inline-flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;

      transition: all 0.25s ease;
    }

    .play-button:hover {
      background: #f5f1eb;
      color: #302c29;
    }

    .progress-container {
      width: min(78vw, 320px);

      margin: 30px auto 0;

      cursor: pointer;
    }

    .progress-line {
      width: 100%;
      height: 2px;

      background: #55504b;

      position: relative;
    }

    .progress {
      width: 0%;
      height: 2px;

      background: #f5f1eb;

      position: absolute;
      left: 0;
      top: 0;
    }

    .time {
      display: flex;
      justify-content: space-between;

      margin-top: 8px;

      font-size: 10px;
      color: #96908a;
    }

    /* ---------- НАДПИСЬ ПОД ПЛЕЕРОМ ---------- */

    .message {
      margin-top: 34px;

      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.03em;

      color: #f5f1eb;

      opacity: 0.9;
    }


    /* ---------- АНИМАЦИИ ---------- */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes songAppear {
      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 360px) {
      .page {
        padding: 22px;
      }

      .cover {
        width: 75vw;
        height: 75vw;
      }

      .message {
        font-size: 14px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <!-- ============================= -->
    <!-- ЭКРАН С ПАРОЛЕМ -->
    <!-- ============================= -->

    <section class="password-screen" id="passwordScreen">

      <div class="heart">♡</div>

      <h1>Сюрприз :)</h1>

      <input
        type="password"
        id="passwordInput"
        class="password-input"
        placeholder="введи пароль"
        autocomplete="off"
      >

      <div class="hint">
        Подсказка: месяц, с которого всё началось
      </div>

      <button class="open-button" onclick="checkPassword()">
        открыть
      </button>

      <div class="error" id="error">
        Кажется, это не тот пароль ♡
      </div>

    </section>


    <!-- ============================= -->
    <!-- ЭКРАН С ПЕСНЕЙ -->
    <!-- ============================= -->

    <section class="song-screen" id="songScreen">

      <!-- Обложка -->
      <img
        src="cover.jpg"
        class="cover"
        alt=""
      >

      <!-- Кнопка Play -->
      <button
        class="play-button"
        id="playButton"
        onclick="togglePlay()"
        aria-label="Воспроизвести"
      >
        ▶
      </button>

      <!-- Прогресс -->
      <div
        class="progress-container"
        onclick="changeProgress(event)"
      >
        <div class="progress-line">
          <div class="progress" id="progress"></div>
        </div>

        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <!-- Надпись -->
      <div class="message">
        Я всегда рядом с тобой
      </div>

    </section>

  </main>


  <!-- ============================= -->
  <!-- ПЕСНЯ -->
  <!-- ============================= -->

  <audio id="song" src="song.mp3" preload="metadata"></audio>


  <script>

    /*
     * =========================================
     * НАСТРОЙКИ
     * =========================================
     */

    const CORRECT_PASSWORD = "январь";


    /*
     * =========================================
     * ПРОВЕРКА ПАРОЛЯ
     * =========================================
     */

    function checkPassword() {

      const input =
        document.getElementById("passwordInput");

      const error =
        document.getElementById("error");

      const password =
        input.value.trim().toLowerCase();


      if (password === CORRECT_PASSWORD.toLowerCase()) {

        document.getElementById("passwordScreen").style.display =
          "none";

        document.getElementById("songScreen").style.display =
          "block";

      } else {

        error.classList.add("show");

        input.value = "";

        setTimeout(function() {
          error.classList.remove("show");
        }, 2500);
      }
    }


    /*
     * Разрешаем нажимать Enter
     */

    document
      .getElementById("passwordInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkPassword();
        }

      });


    /*
     * =========================================
     * АУДИОПЛЕЕР
     * =========================================
     */

    const song =
      document.getElementById("song");

    const playButton =
      document.getElementById("playButton");

    const progress =
      document.getElementById("progress");

    const currentTime =
      document.getElementById("currentTime");

    const duration =
      document.getElementById("duration");


    function togglePlay() {

      if (song.paused) {

        song.play();

        playButton.textContent = "Ⅱ";

      } else {

        song.pause();

        playButton.textContent = "▶";

      }
    }


    /*
     * Обновляем прогресс
     */

    song.addEventListener("timeupdate", function() {

      if (!song.duration) return;

      const percent =
        (song.currentTime / song.duration) * 100;

      progress.style.width =
        percent + "%";

      currentTime.textContent =
        formatTime(song.currentTime);

    });


    /*
     * Показываем продолжительность
     */

    song.addEventListener("loadedmetadata", function() {

      duration.textContent =
        formatTime(song.duration);

    });


    /*
     * Возвращаем кнопку Play после окончания песни
     */

    song.addEventListener("ended", function() {

      playButton.textContent = "▶";

      progress.style.width = "0%";

      currentTime.textContent = "0:00";

    });


    /*
     * Перемотка по полосе
     */

    function changeProgress(event) {

      if (!song.duration) return;

      const container =
        event.currentTarget;

      const rect =
        container.getBoundingClientRect();

      const clickPosition =
        event.clientX - rect.left;

      const percentage =
        clickPosition / rect.width;

      song.currentTime =
        percentage * song.duration;
    }


    /*
     * Формат времени 00:00
     */

    function formatTime(seconds) {

      if (isNaN(seconds)) return "0:00";

      const minutes =
        Math.floor(seconds / 60);

      const secs =
        Math.floor(seconds % 60);

      return minutes + ":" +
        (secs < 10 ? "0" : "") +
        secs;
    }

  </script>

</body>
</html>
```
